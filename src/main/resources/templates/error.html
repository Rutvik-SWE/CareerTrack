<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error - CareerTrack</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .error-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            background-color: var(--bg-light);
        }
        .error-card {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            max-width: 500px;
            width: 90%;
        }
        .error-icon {
            font-size: 64px;
            color: var(--danger);
            margin-bottom: 20px;
        }
        .error-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 15px;
        }
        .error-message {
            color: var(--text-light);
            margin-bottom: 30px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-card">
            <i class="fa-solid fa-triangle-exclamation error-icon"></i>
            <h1 class="error-title">Oops! Something went wrong</h1>
            <p class="error-message" th:text="${message != null ? message : 'An unexpected error occurred. Please try again later.'}"></p>
            <a th:href="@{/dashboard}" class="btn"><i class="fa-solid fa-house"></i> Back to Dashboard</a>
        </div>
    </div>
</body>
</html>
