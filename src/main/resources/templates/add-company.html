<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${company.id != null ? 'Edit Company' : 'Add Company'} + ' - CareerTrack'"></title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <a th:href="@{/dashboard}" class="sidebar-brand">
                <i class="fa-solid fa-briefcase"></i> CareerTrack
            </a>
            <ul class="sidebar-nav">
                <li><a th:href="@{/dashboard}"><i class="fa-solid fa-house"></i> Dashboard</a></li>
                <li><a th:href="@{/applications}"><i class="fa-solid fa-file-lines"></i> Applications</a></li>
                <li><a th:href="@{/companies}" class="active"><i class="fa-solid fa-building"></i> Companies</a></li>
                <li><a th:href="@{/profile}"><i class="fa-solid fa-user"></i> Profile</a></li>
            </ul>
            <ul class="sidebar-nav" style="flex-grow: 0; padding-bottom: 20px;">
                <li>
                    <form th:action="@{/logout}" method="post">
                        <button type="submit"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
                    </form>
                </li>
            </ul>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <div class="mb-4">
                <h2 th:text="${company.id != null ? 'Edit Company' : 'Add Company'}"></h2>
                <p class="subtitle" th:text="${company.id != null ? 'Update company details.' : 'Add a company to your list.'}"></p>
            </div>

            <div class="form-card" style="max-width: 600px;">
                <form th:action="@{/companies/save}" th:object="${company}" method="post">
                    <input type="hidden" th:field="*{id}">
                    
                    <div class="form-group">
                        <label for="name">Company Name *</label>
                        <input type="text" id="name" th:field="*{name}" placeholder="Enter company name" required>
                        <div class="alert alert-error mt-3" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                    </div>
                    
                    <div class="form-group">
                        <label for="website">Website (Optional)</label>
                        <input type="url" id="website" th:field="*{website}" placeholder="https://">
                    </div>
                    
                    <div class="form-group">
                        <label for="location">Location (Optional)</label>
                        <input type="text" id="location" th:field="*{location}" placeholder="Enter location">
                    </div>
                    
                    <div class="mt-3" style="display: flex; gap: 10px; justify-content: flex-end;">
                        <a th:href="@{/companies}" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn">Save Company</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
